name: Build APK

# Builds the debug APK on every push to the working branch (or manually),
# runs the unit tests, and publishes the APK so it can be downloaded on a phone.
on:
  push:
    branches: [ "claude/fervent-brown-tqh967", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IELTS-Reading-Gujarati-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Reading-Gujarati-debug
          path: IELTS-Reading-Gujarati-debug.apk

      - name: Publish APK to the "latest-test" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          name: Latest test build
          body: |
            Test build from commit ${{ github.sha }}.
            Download IELTS-Reading-Gujarati-debug.apk on your Android phone and open it to install.
          prerelease: true
          files: IELTS-Reading-Gujarati-debug.apk
